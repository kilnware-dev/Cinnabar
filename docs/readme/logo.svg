<svg xmlns="http://w3.org" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- 22.5° angle from bottom-left to top-right -->
    <linearGradient id="pinwheelGradient" gradientUnits="userSpaceOnUse" x1="150" y1="645" x2="850" y2="355">
      <stop offset="0%" stop-color="#e32219" />
      <stop offset="48%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#ffce00" />
    </linearGradient>
  </defs>

  <!-- Pinwheel cross shape with curved outer edges and rounded corners -->
  <path d="
    M 435 100
    Q 435 80 455 83
    C 590 105 680 215 680 370
    L 680 390
    L 900 390
    Q 920 390 917 410
    C 895 545 785 635 630 635
    L 610 635
    L 610 900
    Q 610 920 590 917
    C 455 895 365 785 365 630
    L 365 610
    L 100 610
    Q 80 610 83 590
    C 105 455 215 365 370 365
    L 435 365
    Z"
    fill="url(#pinwheelGradient)"
    stroke="#161212"
    stroke-width="26"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
